<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clock Room · AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
      isolation: isolate;
    }

    #cameraShade {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: #000;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #container[data-tracking] #cameraShade { opacity: 0.82; }

    #dialogue {
      position: fixed;
      top: max(70px, 20dvh, calc(env(safe-area-inset-top) + 30px));
      left: 50%;
      width: min(calc(100% - 28px), 620px);
      transform: translateX(-50%);
      text-align: center;
      z-index: 19;
      pointer-events: none;
      text-shadow: 0 2px 3px #000, 0 0 7px #000;
    }

    #englishCaption {
      min-height: 1.2em;
      color: #ffe465;
      font-size: clamp(18px, 4vw, 25px);
      font-style: italic;
      font-weight: 750;
      line-height: 1.18;
    }

    #koreanCaption {
      margin-top: 4px;
      color: #fff4db;
      font-size: clamp(13px, 3vw, 17px);
      font-weight: 600;
      line-height: 1.25;
    }

    #status {
      position: fixed;
      top: calc(max(12px, env(safe-area-inset-top)) + 34px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      color: white;
      background: #222c;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

    #touchArea {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
      background: transparent;
    }

    #startButton {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
    }

    #soundNotice {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 16;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 1px 5px #000, 0 0 8px #000;
      pointer-events: none;
    }

    #answerButton {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 17;
      border: 0;
      border-radius: 24px;
      padding: 13px 22px;
      background: #76162b;
      color: #fff;
      font: inherit;
      font-weight: 700;
      touch-action: manipulation;
    }

  </style>
</head>

<body>

  <div id="container"><div id="cameraShade" aria-hidden="true"></div></div>
  <div id="touchArea"></div>

  <div id="soundNotice">소리를 켜주세요</div>
  <div id="status" role="status">AR 준비 중...</div>

  <button id="startButton">카메라 시작</button>
  <div id="dialogue" hidden>
    <div id="englishCaption" lang="en"></div>
    <div id="koreanCaption" lang="ko"></div>
  </div>
  <button id="answerButton" type="button" hidden>전화 받기</button>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const answerButton = document.getElementById("answerButton");
    const touchArea = document.getElementById("touchArea");
    const container = document.getElementById("container");
    const dialogue = document.getElementById("dialogue");
    const englishCaption = document.getElementById("englishCaption");
    const koreanCaption = document.getElementById("koreanCaption");


    // AR 초기 설정
    const mindarThree = new MindARThree({
      container,
      imageTargetSrc: "./targets.mind",
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    // 전화기와 영상의 이동·회전·크기를 따로 조작합니다.
    const modelMoveGroup = new THREE.Group();
    const backgroundMoveGroup = new THREE.Group();
    const phoneShakeGroup = new THREE.Group();
    modelMoveGroup.add(phoneShakeGroup);
    const phoneAnchor = new THREE.Group();
    phoneAnchor.visible = false;
    phoneAnchor.add(modelMoveGroup);
    scene.add(phoneAnchor);
    anchor.group.add(backgroundMoveGroup);


    // 조명
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x444444, 1.5)
    ); 
    // 환경라이트, 수치가 밝기
    const directionalLight = new THREE.DirectionalLight(
      0xffffff, 2
    );
    
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // MP4는 포스터 전체입니다. 추적 타겟에 해당하는 상단 영역만 벽에 겹칩니다.
    const VIDEO_FILE = "./clock-room-poster.mp4";
    const MODEL_FILE = "./phone.glb";
    const POSTER_WIDTH = 1054;
    const POSTER_HEIGHT = 1492;
    const TARGET_HEIGHT = 1364;
    const PHONE_SIZE = 0.50;
    const RECEIVER_LIFT = 0.11;
    const RECEIVER_REACH = 0.035;
    const RECEIVER_TILT = 0.16;
    const RING_PERIOD = 2.2;
    // 배포된 phone.glb의 수화기와 줄 윗부분 정점 범위입니다.
    const HANDSET_RANGES = [[32932, 33465], [37941, 38098], [39294, 39296]];
    const CORD_RANGES = [
      [22873, 22876], [22906, 22915], [22939, 22952], [22973, 22989],
      [23006, 23026], [23040, 23063], [23076, 23100], [23110, 23137],
      [23144, 32435], [37569, 37873], [39276, 39285], [39486, 39526], [39775, 39780]
    ];
    let handsetRig = null;
    let handsetDeformed = false;
    let phonePlaced = false;
    let phoneState = "idle";
    let phoneStateStartedAt = 0;

    let modelRoot = null;
    let initialFitScale = 1;
    let modelFailed = false;
    let videoReady = false;
    let videoFailed = false;
    let clockPlaybackAttempt = 0;

    let backgroundMesh = null;
    let targetVisible = false;
    let started = false;
    let starting = false;

    const loader = new GLTFLoader();


    const video = document.createElement("video");
    video.src = VIDEO_FILE;
    video.loop = true;
    video.muted = false;
    video.playsInline = true;
    video.preload = "auto";
    video.volume = 0.55;

    clockMask.repeat.y = TARGET_HEIGHT / POSTER_HEIGHT;
    clockMask.offset.y = 1 - clockMask.repeat.y;

    function updateStatus() {
      if (!started) return;
      if (!targetVisible) {
        status.textContent = "포스터를 카메라에 비춰주세요";
      } else if (videoFailed || modelFailed) {
        status.textContent = videoFailed ? "시계 영상을 불러올 수 없어요" : "전화기 모델을 불러올 수 없어요";
      } else {
        status.textContent = phoneState === "idle" && modelRoot ? "전화기를 터치하세요" : "";
      }
      status.hidden = !status.textContent;
      answerButton.hidden = !targetVisible || phoneState !== "ringing" || !handsetRig;
    }

    function playBackgroundVideo(unmute = false) {
      if (!targetVisible || !videoReady || videoFailed) return;
      if (clockSilentDuringCall()) video.muted = true;
      else if (unmute) video.muted = false;
      const attempt = ++clockPlaybackAttempt;
      video.play().catch((error) => {
        if (attempt !== clockPlaybackAttempt || !targetVisible) return;
        if (error.name === "NotAllowedError" && !video.muted) {
          // 소리 자동재생이 차단되면 영상부터 시작하고 첫 화면 터치에서 소리를 재개합니다.
          video.muted = true;
          video.play().catch(() => {});
        }
      });
    }

    video.addEventListener("loadedmetadata", () => {
      if (videoReady || videoFailed) return;
      const texture = new THREE.VideoTexture(video);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.repeat.y = TARGET_HEIGHT / POSTER_HEIGHT;
      texture.offset.y = 1 - texture.repeat.y;
      const material = new THREE.MeshBasicMaterial({
        map: texture, alphaMap: clockMask, transparent: true, alphaTest: 0.018,
        depthWrite: false, toneMapped: false
      });
      backgroundMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, TARGET_HEIGHT / POSTER_WIDTH), material);
      backgroundMesh.visible = video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA;
      backgroundMoveGroup.add(backgroundMesh);
      videoReady = true;
      playBackgroundVideo();
    });

    video.addEventListener("loadeddata", () => {
      if (backgroundMesh) backgroundMesh.visible = true;
    });
    video.addEventListener("error", () => {
      videoFailed = true;
      if (backgroundMesh) backgroundMesh.visible = false;
      updateStatus();
    });
    function clockSilentDuringCall() {
      return phoneState === "answering" || phoneState === "returning";
    }

    function enableClockAudioFromGesture() {
      if (targetVisible && video.muted && !clockSilentDuringCall()) playBackgroundVideo(true);
    }

    document.addEventListener("pointerup", enableClockAudioFromGesture, { capture: true });
    document.addEventListener("keydown", enableClockAudioFromGesture);
    video.load();

    // GLB 3D 모델 로딩
    loader.load(

      MODEL_FILE,

      (gltf) => {

        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
          modelFailed = true;
          updateStatus();
          return;
        }

        initialFitScale = PHONE_SIZE / maxDimension;

        // 모델의 가운데를 기준으로 배치
        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );

        // 크기 및 회전 조작 그룹
        modelRoot = new THREE.Group();

        modelRoot.scale.setScalar(initialFitScale);
        const presentation = new THREE.Group();
        presentation.add(model);
        handsetRig = bindHandset(model);
        if (handsetRig) {
          // 버튼 배열의 깊이 방향(+X에 가깝고 Z가 약간 음수)에서 위로 30° 올려 봅니다.
          const elevatedFront = new THREE.Vector3(0.8633, 0.5, -0.0693);
          const frontMatrix = new THREE.Matrix4().lookAt(elevatedFront, new THREE.Vector3(), phoneUp);
          presentation.quaternion.setFromRotationMatrix(frontMatrix).invert();
        }
        modelRoot.add(presentation);

        phoneShakeGroup.add(modelRoot);
        updateStatus();

      },

      undefined,

      (error) => {
        modelFailed = true;
        updateStatus();
        console.error("전화기 모델 로딩 실패:", error);
      }

    );


    anchor.onTargetFound = () => {
      targetVisible = true;
      container.setAttribute("data-tracking", "");
      playBackgroundVideo(true);
      updateStatus();
    };

    anchor.onTargetLost = () => {
      targetVisible = false;
      phoneAnchor.visible = false;
      phonePoseTime = null;
      container.removeAttribute("data-tracking");
      clockPlaybackAttempt++;
      video.pause();
      activePointers.clear();
      tapCandidate = false;
      singleStartTarget = null;
      dragHasPrev = false;
      dragTargetGroup = null;
      pinchStartDistance = 0;
      updateStatus();
    };


    // 카메라 시작
    async function startAR() {

      if (started || starting) return;

      starting = true;

      status.hidden = false;
      status.textContent = "카메라 권한 확인 중...";
      startButton.style.display = "none";

      try {

        await mindarThree.start();

        started = true;
        starting = false;

        renderer.setAnimationLoop((now) => {
          if (targetVisible) {
            smoothPhonePose(now);
            if (modelRoot && !phonePlaced) placePhoneInView();
            phoneAnchor.visible = phonePlaced;
          }
          updatePhoneMotion(now);
          updateCaptions(now);
          renderer.render(scene, camera);
        });

        updateStatus();

      } catch (error) {

        console.error("AR 시작 오류:", error);

        starting = false;

        status.textContent = "카메라 권한과 마커 파일을 확인해주세요";
        startButton.style.display = "block";

      }

    }

    async function unlockClockAndStart(showStartIfBlocked) {
      video.muted = false;
      // 틱 사이의 조용한 구간에서 재생 권한을 확인합니다.
      video.currentTime = 0.25;
      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (error) {
        if (showStartIfBlocked && error.name === "NotAllowedError") {
          status.textContent = "카메라를 시작해주세요";
          startButton.style.display = "block";
          return;
        }
      }
      startAR();
    }

    startButton.addEventListener("click", () => {
      if (started || starting) return;
      startButton.style.display = "none";
      unlockClockAndStart(false);
    });


    // 한 손가락 회전
   // 두 손가락 확대 / 축소 + 위치 이동
    const activePointers = new Map();

    // 전화기 탭 판정 기준
    const TAP_MOVE_LIMIT = 10;   // px: 이 이상 움직이면 탭이 아님
    const TAP_MAX_TIME = 400;    // ms: 이 시간 안에 손을 떼야 탭

    // 한 손가락 터치 상태

    let tapCandidate = false;

    let tapStartY = 0;
    let tapStartTime = 0;

    function getPinchDistance() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return 0;

      const dx = points[0].x - points[1].x;
      const dy = points[0].y - points[1].y;

      return Math.sqrt(dx * dx + dy * dy);

    }

    // 두 손가락 중간점 (화면 좌표)
    function getPinchMidpoint() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return null;

      return {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2
      };

    }

    // 화면 좌표 -> 마커 
    // 카메라 광선이 마커와 만나는 지점을 사용합니다.
    const dragRaycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane();
    const dragNdc = new THREE.Vector2();
    const dragPlaneNormal = new THREE.Vector3();
    const dragPlanePoint = new THREE.Vector3();
    const dragHitPoint = new THREE.Vector3();

    // 화면 좌표에서 카메라 광선 생성
    function setRayFromScreen(clientX, clientY) {

      const rect = renderer.domElement.getBoundingClientRect();

      if (!rect.width || !rect.height) return false;

      dragNdc.set(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );

      camera.updateMatrixWorld();
      camera.projectionMatrixInverse
        .copy(camera.projectionMatrix)
        .invert();

      dragRaycaster.setFromCamera(dragNdc, camera);

      anchor.group.updateMatrixWorld(true);

      return true;

    }

    function screenToAnchorLocal(clientX, clientY, out, depth, reference) {

      if (!setRayFromScreen(clientX, clientY)) return false;

      reference.updateWorldMatrix(true, false);
      dragPlaneNormal
        .set(0, 0, 1)
        .transformDirection(reference.matrixWorld);

      dragPlanePoint.set(0, 0, depth).applyMatrix4(reference.matrixWorld);

      dragPlane.setFromNormalAndCoplanarPoint(
        dragPlaneNormal,
        dragPlanePoint
      );

      if (!dragRaycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
        return false;
      }

      out.copy(dragHitPoint);
      reference.worldToLocal(out);

      return true;

    }

    const trackedPosition = new THREE.Vector3();
    const trackedRotation = new THREE.Quaternion();
    const trackedScale = new THREE.Vector3();
    let phonePoseTime = null;

    function smoothPhonePose(now) {
      anchor.group.updateWorldMatrix(true, false);
      anchor.group.matrixWorld.decompose(trackedPosition, trackedRotation, trackedScale);
      const blend = phonePoseTime === null ? 1 : -Math.expm1(-Math.max(0, now - phonePoseTime) / 155);
      phoneAnchor.position.lerp(trackedPosition, blend);
      phoneAnchor.quaternion.slerp(trackedRotation, blend);
      phoneAnchor.scale.lerp(trackedScale, blend);
      phonePoseTime = now;
    }

    const cameraInAnchor = new THREE.Vector3();
    const phoneFacing = new THREE.Matrix4();
    const phoneUp = new THREE.Vector3(0, 1, 0);

    function phoneScreenBounds() {
      const projected = new THREE.Vector3();
      const matrix = new THREE.Matrix4();
      const bounds = new THREE.Box2();
      modelMoveGroup.updateWorldMatrix(true, true);
      modelRoot.traverse((part) => {
        if (!part.isMesh) return;
        const positions = part.geometry.getAttribute("position");
        matrix.multiplyMatrices(camera.matrixWorldInverse, part.matrixWorld);
        matrix.premultiply(camera.projectionMatrix);
        for (let index = 0; index < positions.count; index += 5) {
          projected.fromBufferAttribute(positions, index).applyMatrix4(matrix);
          bounds.min.x = Math.min(bounds.min.x, projected.x);
          bounds.min.y = Math.min(bounds.min.y, projected.y);
          bounds.max.x = Math.max(bounds.max.x, projected.x);
          bounds.max.y = Math.max(bounds.max.y, projected.y);
        }
      });
      return bounds;
    }

    function placePhoneInView() {
      const rect = renderer.domElement.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      phoneAnchor.updateWorldMatrix(true, false);
      camera.getWorldPosition(cameraInAnchor);
      phoneAnchor.worldToLocal(cameraInAnchor);
      if (cameraInAnchor.z <= 0) return;

      const depth = cameraInAnchor.z * 0.72;
      const screenX = rect.left + rect.width / 2;
      // 초기 위치는 화면 아래쪽에 맞추고, 전화기 밑에 화면 높이의 1.5%를 남깁니다.
      const bottomEdge = -0.97;
      const targetY = bottomEdge + 0.52 / 2;
      const screenY = rect.top + (1 - targetY) * rect.height / 2;
      if (!screenToAnchorLocal(screenX, screenY, modelMoveGroup.position, depth, phoneAnchor)) return;
      phoneFacing.lookAt(cameraInAnchor, modelMoveGroup.position, phoneUp);
      modelMoveGroup.quaternion.setFromRotationMatrix(phoneFacing);
      // 시작 스케일은 거리에도 비례시켜 처음부터 화면 밖으로 튀는 것을 피합니다.
      modelRoot.scale.setScalar(initialFitScale * Math.min(1, cameraInAnchor.z * 0.25));

      const size = new THREE.Vector2();
      const center = new THREE.Vector2();
      const projectedOrigin = new THREE.Vector3();
      for (let step = 0; step < 4; step++) {
        const bounds = phoneScreenBounds();
        bounds.getSize(size);
        if (size.x <= 0 || size.y <= 0) return;
        const ratio = Math.min(1.84 / size.x, 0.52 / size.y);
        modelRoot.scale.multiplyScalar(ratio);
        const fittedBounds = phoneScreenBounds();
        fittedBounds.getCenter(center);
        modelMoveGroup.getWorldPosition(projectedOrigin).project(camera);
        screenToAnchorLocal(rect.left + (1 + projectedOrigin.x - center.x) * rect.width / 2,
          rect.top + (1 - projectedOrigin.y + fittedBounds.min.y - bottomEdge) * rect.height / 2,
          modelMoveGroup.position, depth, phoneAnchor);
        phoneFacing.lookAt(cameraInAnchor, modelMoveGroup.position, phoneUp);
        modelMoveGroup.quaternion.setFromRotationMatrix(phoneFacing);
      }
      initialFitScale = modelRoot.scale.x;
      phonePlaced = true;
    }

    function setPhoneState(state) {
      const wasQuiet = clockSilentDuringCall();
      phoneState = state;
      if (clockSilentDuringCall()) video.muted = true;
      else if (wasQuiet) playBackgroundVideo(true);
      phoneStateStartedAt = performance.now();
      updateStatus();
    }

    function stopBell() {
      ringAudio.pause();
      ringAudio.currentTime = 0;
    }

    function startBell() {
      if (phoneState !== "idle") return;
      ringAudio.currentTime = 0;
      setPhoneState("ringing");
      ringAudio.play().catch(() => {});
    }

    function answerPhone() {
      if (phoneState !== "ringing" || !handsetRig || !targetVisible) return;
      stopBell();
      receiverAudio.currentTime = 0;
      setPhoneState("answering");
      receiverAudio.play().catch(() => {});
    }

    answerButton.addEventListener("click", answerPhone);
    receiverAudio.addEventListener("ended", () => {
      if (phoneState === "answering") setPhoneState("returning");
    });

    function bindHandset(model) {
      let positions;
      let normals;
      model.traverse((part) => {
        const position = part.geometry?.getAttribute("position");
        const normal = part.geometry?.getAttribute("normal");
        if (!part.isMesh || position?.count !== 39801 || normal?.count !== 39801) return;
        if (
          Math.abs(position.getX(32932) + 0.0477411) > 0.00001 ||
          Math.abs(position.getY(32932) - 0.0542156) > 0.00001 ||
          Math.abs(position.getZ(32932) - 0.0936993) > 0.00001
        ) return;
        positions = position;
        normals = normal;
      });
      if (!positions || !normals) return null;

      const vertices = [];
      for (const [ranges, fixedWeight] of [[HANDSET_RANGES, true], [CORD_RANGES, false]]) {
        for (const [first, last] of ranges) {
          for (let index = first; index <= last; index++) {
            const y = positions.getY(index);
            vertices.push({
              index,
              x: positions.getX(index),
              y,
              z: positions.getZ(index),
              nx: normals.getX(index),
              ny: normals.getY(index),
              nz: normals.getZ(index),
              weight: fixedWeight ? 1 : THREE.MathUtils.smoothstep(y, -0.05, 0.006)
            });
          }
        }
      }
      return { positions, normals, vertices };
    }

    function deformHandset(angle, lift, reach) {
      const { positions, normals, vertices } = handsetRig;
      const centerY = 0.043;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      for (const { index, x, y, z, nx, ny, nz, weight } of vertices) {
        const dy = y - centerY;
        positions.setXYZ(index, x + weight * reach, y + weight * (dy * (cos - 1) - z * sin + lift),
          z + weight * (dy * sin + z * (cos - 1)));
        const newNY = ny + weight * (ny * (cos - 1) - nz * sin);
        const newNZ = nz + weight * (ny * sin + nz * (cos - 1));
        const length = Math.hypot(nx, newNY, newNZ) || 1;
        normals.setXYZ(index, nx / length, newNY / length, newNZ / length);
      }
      positions.needsUpdate = true;
      normals.needsUpdate = true;
    }

    function updatePhoneMotion(now) {
      const elapsed = Math.max(0, (now - phoneStateStartedAt) / 1000);
      let angle = 0;
      let lift = 0;
      let reach = 0;

      if (phoneState === "ringing") {
        const phase = ringAudio.paused ? elapsed % RING_PERIOD : ringAudio.currentTime;
        const strength = THREE.MathUtils.smoothstep(phase, 0.01, 0.08)
          * (1 - THREE.MathUtils.smoothstep(phase, 1.35, 1.62));
        angle = Math.sin(elapsed * Math.PI * 23) * strength * 0.22;
        lift = strength * (0.016 + 0.011 * Math.sin(elapsed * Math.PI * 16));
        reach = Math.sin(elapsed * Math.PI * 29) * strength * 0.012;
      } else if (phoneState === "answering" || phoneState === "returning") {
        const lifting = phoneState === "answering";
        const amount = lifting
          ? 1 - Math.pow(1 - Math.min(elapsed / 0.53, 1), 3)
          : 1 - THREE.MathUtils.smoothstep(elapsed, 0, 0.57);
        angle = RECEIVER_TILT * amount;
        lift = RECEIVER_LIFT * amount;
        reach = RECEIVER_REACH * amount;
        const finalCue = dialogueCues[dialogueCues.length - 1];
        const callTimeout = Math.max(finalCue.end + 1.2, (receiverAudio.duration || 0) + 0.65);
        if (lifting && elapsed > callTimeout) {
          receiverAudio.pause();
          setPhoneState("returning");
        } else if (!lifting && elapsed >= 0.57) {
          setPhoneState("idle");
        }
      }

      if (handsetRig) {
        const moving = angle !== 0 || lift !== 0 || reach !== 0;
        if (moving || handsetDeformed) {
          deformHandset(angle, lift, reach);
          handsetDeformed = moving;
        }
      } else {
        phoneShakeGroup.rotation.z = angle;
        phoneShakeGroup.position.set(reach, lift, 0);
      }
    }

    // 두 손가락 이동 상태
    const dragPrevLocal = new THREE.Vector3();
    const dragCurrLocal = new THREE.Vector3();
    let dragHasPrev = false;
    let dragTargetGroup = null;

    function readDragPosition(midpoint, out) {
      const reference = dragTargetGroup === modelMoveGroup ? phoneAnchor : anchor.group;
      return screenToAnchorLocal(midpoint.x, midpoint.y, out, dragTargetGroup.position.z, reference);
    }

    // 전화기가 가리고 있는 곳에서는 전화기를 먼저 조작합니다.
    function pickTargetAtPoint(clientX, clientY) {

      if (!setRayFromScreen(clientX, clientY)) return null;

      if (modelRoot && phoneAnchor.visible) {
        modelMoveGroup.updateWorldMatrix(true, true);

        const modelHits = dragRaycaster.intersectObject(
          modelMoveGroup,
          true
        );

        if (modelHits.length > 0) return "model";

      }

      if (backgroundMesh?.visible) {

        const backgroundHits = dragRaycaster.intersectObject(
          backgroundMesh,
          false
        );

        if (backgroundHits.length > 0) return "background";

      }

      return null;

    }

    // 수화기처럼 좁은 곳에서도 첫 손가락을 전화기에 올리면 확대할 수 있습니다.
    function pickDragTarget() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return null;
      const first = pickTargetAtPoint(points[0].x, points[0].y);
      const second = pickTargetAtPoint(points[1].x, points[1].y);
      if (first === "model" || second === "model") return modelMoveGroup;
      if (first === "background" && second === "background") return backgroundMoveGroup;
      return null;
    }

    touchArea.addEventListener("pointerdown", (e) => {

      // 전화기가 아직 로딩 중에도 영상은 조작할 수 있습니다.
      if (!targetVisible) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      touchArea.setPointerCapture(e.pointerId);

      if (activePointers.size === 1) {

        previousX = e.clientX;
        previousY = e.clientY;

        // 터치 시작 지점의 대상 판별 및 탭 판정 시작
        singleStartTarget = pickTargetAtPoint(e.clientX, e.clientY);

        tapCandidate = true;
        tapStartX = e.clientX;
        tapStartY = e.clientY;
        tapStartTime = performance.now();

      }

      if (activePointers.size === 2) {

        // 핀치 제스처는 전화기 탭으로 처리하지 않습니다.
        singleStartTarget = null;
        tapCandidate = false;

        pinchStartDistance = getPinchDistance();

        // 두 손가락 이동 시작 기준점
        const mid = getPinchMidpoint();

        // 두 손가락이 닿은 대상 판별 후, 대상이 있을 때만 이동 기준점 설정
        dragTargetGroup = pickDragTarget();

        // 핀치 시작 크기: 선택된 대상의 현재 크기
        if (dragTargetGroup === modelMoveGroup && modelRoot) {
          pinchStartScale = modelRoot.scale.x;
        } else if (dragTargetGroup === backgroundMoveGroup) {
          pinchStartScale = backgroundMoveGroup.scale.x;
        } else {
          pinchStartScale = 1;
        }

        dragHasPrev = (mid && dragTargetGroup)
          ? readDragPosition(mid, dragPrevLocal)
          : false;

      }

    });

    touchArea.addEventListener("pointermove", (e) => {

      if (!activePointers.has(e.pointerId)) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      // 한 손가락으로 전화기를 돌립니다.
      if (activePointers.size === 1) {

        // 일정 거리 이상 움직이면 탭이 아님
        if (tapCandidate) {

          const movedX = e.clientX - tapStartX;
          const movedY = e.clientY - tapStartY;

          if (Math.sqrt(movedX * movedX + movedY * movedY) > TAP_MOVE_LIMIT) {
            tapCandidate = false;
          }

        }

        if (singleStartTarget === "model" && modelRoot && !tapCandidate) {

          const deltaX = e.clientX - previousX;
          const deltaY = e.clientY - previousY;

          modelRoot.rotation.y += deltaX * ROTATION_SPEED;
          modelRoot.rotation.x += deltaY * ROTATION_SPEED;

          previousX = e.clientX;
          previousY = e.clientY;

        }

      }

      // 두 손가락: 확대 / 축소 + 위치 이동
      else if (activePointers.size === 2) {

        // 확대 / 축소
        if (dragTargetGroup && pinchStartDistance > 0) {

          const currentDistance = getPinchDistance();

          const scaleRatio = currentDistance / pinchStartDistance;

          const newScale = pinchStartScale * scaleRatio;

          if (dragTargetGroup === modelMoveGroup && modelRoot) {

            // 오브젝트: 기존과 동일한 범위
            const clampedScale = THREE.MathUtils.clamp(
              newScale,
              initialFitScale * 0.1,
              initialFitScale * 10
            );

            modelRoot.scale.setScalar(clampedScale);

          } else if (dragTargetGroup === backgroundMoveGroup) {

            // 영상: 초기 크기(1) 기준 
            const clampedScale = THREE.MathUtils.clamp(
              newScale,
              0.1,
              10
            );

            backgroundMoveGroup.scale.setScalar(clampedScale);

          }

        }

        // 위치 이동: 두 손가락 중간점이 움직인 만큼, 처음 닿은 대상만 이동
        const mid = getPinchMidpoint();

        if (mid && dragTargetGroup) {

          if (!dragHasPrev) {

            dragHasPrev = readDragPosition(mid, dragPrevLocal);

          } else if (readDragPosition(mid, dragCurrLocal)) {

            dragTargetGroup.position.x += dragCurrLocal.x - dragPrevLocal.x;
            dragTargetGroup.position.y += dragCurrLocal.y - dragPrevLocal.y;

            dragPrevLocal.copy(dragCurrLocal);

          }

        }

      }

    });

    function stopPointer(e) {

      if (!activePointers.has(e.pointerId)) return;

      // 짧게 전화기를 탭하면 벨이 울립니다.
      if (
        e.type === "pointerup" &&
        activePointers.size === 1 &&
        tapCandidate &&
        targetVisible &&
        singleStartTarget === "model" &&
        Math.hypot(e.clientX - tapStartX, e.clientY - tapStartY) <= TAP_MOVE_LIMIT &&
        performance.now() - tapStartTime < TAP_MAX_TIME
      ) {
        startBell();
      }

      tapCandidate = false;
      singleStartTarget = null;

      activePointers.delete(e.pointerId);

      // 두 손가락 상태가 끝나면 이동 기준점 및 대상 해제
      dragHasPrev = false;
      dragTargetGroup = null;

      // 손가락을 떼면 상단 상태 문구 원복
      updateStatus();

      if (activePointers.size === 1) {

        const remaining = Array.from(activePointers.values())[0];

        previousX = remaining.x;
        previousY = remaining.y;

      } else if (activePointers.size === 0) {

        pinchStartDistance = 0;

      }

    }

    touchArea.addEventListener("pointerup", stopPointer);
    touchArea.addEventListener("pointercancel", stopPointer);
    touchArea.addEventListener("lostpointercapture", stopPointer);

    unlockClockAndStart(true);

  </script>

</body>
